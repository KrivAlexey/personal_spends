name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow the conventions, test-first workflow and
            definition of done in CLAUDE.md, and check docs/architecture.md and
            openspec/specs/ where the change touches them.

            Look for, in this order: bugs, risks (security, data loss, real bank data
            or secrets in the diff, unhandled errors), design problems, style.

            - Leave inline comments on specific lines with
              mcp__github_inline_comment__create_inline_comment. Each says the
              severity (bug/risk/design/style), the problem, and a concrete failing
              input or scenario.
            - Finish with one summary comment via `gh pr comment`, findings ranked
              bug > risk > design > style. If nothing is wrong, say so in one line.
            - Comment only. Do not edit files, push commits, approve or request changes.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
