schema: spec-driven

context: |
  Go backend (Go 1.26) for personal expense tracking: bank CSV upload, Claude
  categorization, DynamoDB storage, REST API (API Gateway + Lambda) and a local
  stdio MCP server. Conventions, git workflow and definition of done: CLAUDE.md.
  Structure and backlog: docs/architecture.md. Decisions: docs/decisions/.

  OpenSpec is for changes to observable behavior only: REST/MCP contracts, the
  Categorizer contract, CSV parsing rules. Decisions go in ADRs, structure in
  docs/architecture.md, not in specs.

rules:
  design:
    - For Go type, interface, context and concurrency choices, follow the golang-structs-interfaces, golang-context and golang-concurrency skills in .agents/skills/
  tasks:
    - Order each task group test-first (failing tests, then implementation), per the test-first workflow in CLAUDE.md
    - End with a single review task, after all code and docs tasks and before opening the PR, that runs the go-reviewer agent on the full diff

operations:
  apply:
    guidance:
      - Before the first coding task, read the Go skills listed in .claude/rules/go.md
      - Write each task group's failing tests first (the go-test-writer agent can do it), confirm they fail on an assertion, then implement
      - In the final review task, fix go-reviewer's bug and risk findings; stop and ask if a fix needs a core interface change (Categorizer, CategoryProvider, BankMappingProvider), a new dependency or a skipped test
