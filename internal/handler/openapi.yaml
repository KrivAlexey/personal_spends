openapi: 3.1.0
info:
  title: personal_spends
  description: >-
    REST API for importing bank exports and querying categorized expenses.
    Behavior is specified in openspec/specs/rest-api.
  version: "0.1.0"
servers:
  - url: http://localhost:8080
    description: Local server (go run ./cmd/server)
paths:
  /uploads/csv:
    post:
      operationId: uploadCSV
      summary: Import a bank export
      description: >-
        Imports the bank export sent as the raw request body. The bytes are
        kept and passed to the import unchanged, so the bank mapping's declared
        encoding applies. Already-stored transactions are counted, not stored
        again. A body byte-identical to an earlier finished upload is not
        imported again: the response repeats that upload's id and counts.
      parameters:
        - name: bank
          in: query
          required: true
          description: Name of the bank mapping, e.g. sparkasse.
          schema:
            type: string
            minLength: 1
        - name: filename
          in: query
          required: false
          description: Name of the uploaded file, recorded with the upload.
          schema:
            type: string
      requestBody:
        required: true
        description: The bank export file, sent as-is.
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Export imported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: >-
            Missing or empty bank parameter, empty or unreadable body, or no
            bank mapping for bank. Nothing is imported.
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: >-
            A byte-identical file is being imported right now. Nothing is
            imported; retry once it has finished.
          content:
            text/plain:
              schema:
                type: string
        "413":
          description: The body is larger than 10 MiB (10,485,760 bytes). Nothing is kept or imported.
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: >-
            The import failed. The body does not contain the internal error.
            Rows saved before the failure stay saved; re-uploading is safe.
          content:
            text/plain:
              schema:
                type: string
  /uploads:
    get:
      operationId: listUploads
      summary: Recent uploads
      description: >-
        The 100 most recently received upload records, newest first.
        Behavior is specified in openspec/specs/rest-api.
      responses:
        "200":
          description: Upload records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadList"
        "500":
          description: The records could not be read. The body does not contain the internal error.
          content:
            text/plain:
              schema:
                type: string
  /banks:
    get:
      operationId: listBanks
      summary: Configured banks
      description: The bank mapping names POST /uploads/csv accepts as bank, sorted.
      responses:
        "200":
          description: Bank names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankList"
  /:
    get:
      operationId: getWebPage
      summary: Upload web page
      description: >-
        The browser page for uploading exports and listing uploads. Served with
        Content-Security-Policy default-src 'self'; frame-ancestors 'none'.
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema:
                type: string
  /app.js:
    get:
      operationId: getWebScript
      summary: Upload web page script
      responses:
        "200":
          description: The page's script.
          content:
            text/javascript:
              schema:
                type: string
  /app.css:
    get:
      operationId: getWebStyles
      summary: Upload web page styles
      responses:
        "200":
          description: The page's styles.
          content:
            text/css:
              schema:
                type: string
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: This OpenAPI document
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
components:
  schemas:
    UploadResult:
      type: object
      required: [upload_id, imported, already_known, pending_skipped]
      properties:
        upload_id:
          type: string
          description: Id of the upload; the same for every upload of the same bytes.
        imported:
          type: integer
          description: New transactions categorized and stored.
        already_known:
          type: integer
          description: Transactions already stored by an earlier upload.
        pending_skipped:
          type: integer
          description: Pending (not yet booked) transactions, skipped.
    UploadList:
      type: object
      required: [uploads]
      properties:
        uploads:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/UploadEntry"
    UploadEntry:
      type: object
      required: [upload_id, filename, bank, uploaded_at, status, imported, already_known, pending_skipped]
      properties:
        upload_id:
          type: string
        filename:
          type: string
          description: File name given at upload, empty when none was given.
        bank:
          type: string
        uploaded_at:
          type: string
          format: date-time
          description: When the file was first received, RFC 3339 in UTC.
        status:
          type: string
          enum: [processing, done, failed]
        imported:
          type: [integer, "null"]
          description: Set when status is done, null otherwise.
        already_known:
          type: [integer, "null"]
          description: Set when status is done, null otherwise.
        pending_skipped:
          type: [integer, "null"]
          description: Set when status is done, null otherwise.
    BankList:
      type: object
      required: [banks]
      properties:
        banks:
          type: array
          items:
            type: string
